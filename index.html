<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TL Book Club · 共读书单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f5f3ef;
  font-family: 'Noto Sans SC', sans-serif;
  color: #2a2218;
  padding: 12px 12px 32px;
}

.page {
  max-width: 600px;
  margin: 0 auto;
  background: #faf9f6;
  border-radius: 12px;
  overflow: hidden;
}

/* ── Header ── */
.header {
  padding: 22px 20px 16px;
  border-bottom: 0.5px solid #e0ddd6;
}

.header-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 5px;
}

.header-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: #1a1816;
  letter-spacing: 0.04em;
}

.header-count {
  font-size: 10px;
  color: #b0a898;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.header-sub {
  font-size: 10px;
  color: #9a8c78;
  letter-spacing: 0.2em;
}

/* ── Shelf grid ── */
.shelf {
  padding: 14px 14px 16px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* ── Book card ── */
.book-card {
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  border-radius: 7px;
  overflow: hidden;
  background: #fff;
  border: 0.5px solid #e0ddd6;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.book-card:active {
  transform: scale(0.97);
}

@media (hover: hover) {
  .book-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 16px rgba(42,34,24,0.10);
  }
}

.cover-wrap {
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: #ece8df;
}

.cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.book-info {
  padding: 6px 8px 7px;
  border-top: 0.5px solid #e8e4dc;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.book-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  font-weight: 700;
  color: #1a1816;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-date {
  font-size: 9px;
  color: #b0a898;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Placeholder card ── */
.book-placeholder {
  display: flex;
  flex-direction: column;
  border-radius: 7px;
  overflow: hidden;
  border: 1px dashed #d4cec4;
}

.placeholder-cover {
  width: 100%;
  aspect-ratio: 3 / 4;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0ece3;
}

.placeholder-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid #c9a227;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c9a227;
  font-size: 14px;
  line-height: 1;
  opacity: 0.5;
}

.placeholder-info {
  padding: 6px 8px 7px;
  border-top: 0.5px solid #e8e4dc;
}

.placeholder-label {
  font-size: 9px;
  color: #c0b8ac;
  letter-spacing: 0.06em;
  text-align: center;
}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-top">
      <div class="header-title">TL Book Club</div>
      <div class="header-count">共 1 本</div>
    </div>
    <div class="header-sub">共读书单</div>
  </div>

  <div class="shelf">

    <!-- 反脆弱 -->
    <a class="book-card" href="antifragile.html">
      <div class="cover-wrap">
        <img src="反脆弱封面图.jpg" alt="反脆弱封面">
      </div>
      <div class="book-info">
        <div class="book-title">反脆弱</div>
        <div class="book-date">2026年5月 — 至今 · 共1场</div>
      </div>
    </a>

    <!-- 占位 × 2 -->
    <div class="book-placeholder">
      <div class="placeholder-cover"><div class="placeholder-icon">＋</div></div>
      <div class="placeholder-info"><div class="placeholder-label">即将加入</div></div>
    </div>
    <div class="book-placeholder">
      <div class="placeholder-cover"><div class="placeholder-icon">＋</div></div>
      <div class="placeholder-info"><div class="placeholder-label">即将加入</div></div>
    </div>

  </div>

</div>
</body>
</html>
