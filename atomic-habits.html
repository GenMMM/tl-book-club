<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原子习惯 · TL Book Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f5f3ef;
  font-family: 'Noto Sans SC', sans-serif;
  color: #2a2218;
  padding: 24px 16px 60px;
}

.page {
  max-width: 600px;
  margin: 0 auto;
  background: #faf9f6;
  border-radius: 12px;
  overflow: hidden;
}

/* ── Back nav ── */
.back-nav {
  padding: 16px 28px 0;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: #9a8c78;
  text-decoration: none;
  letter-spacing: 0.08em;
  transition: color 0.15s;
}

.back-link:hover { color: #6b6358; }

.back-arrow {
  font-size: 13px;
  line-height: 1;
}

/* ── Header ── */
.header {
  padding: 24px 28px 28px;
  border-bottom: 0.5px solid #e0ddd6;
}

.book-label {
  font-size: 10px;
  color: #b0a898;
  letter-spacing: 0.2em;
  margin-bottom: 12px;
}

.book-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 30px;
  font-weight: 700;
  color: #1a1816;
  line-height: 1.3;
  margin-bottom: 6px;
}

.book-author {
  font-size: 12px;
  color: #9a8c78;
  letter-spacing: 0.06em;
  margin-bottom: 20px;
}

.book-core {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: #4a453e;
  line-height: 1.9;
  padding: 14px 16px;
  background: #f0ece3;
  border-radius: 6px;
  border-left: 3px solid #c9a227;
  margin-bottom: 20px;
}

.book-stats {
  display: flex;
  gap: 20px;
  font-size: 11px;
  color: #9a8c78;
}

.stat {
  display: flex;
  align-items: center;
  gap: 5px;
  letter-spacing: 0.04em;
}

.stat-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #c9a227;
  flex-shrink: 0;
}

/* ── Section label ── */
.section-label {
  padding: 22px 28px 14px;
  font-size: 9px;
  color: #b0a898;
  letter-spacing: 0.25em;
  border-bottom: 0.5px solid #e0ddd6;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sort-btn {
  font-size: 9px;
  color: #9a8c78;
  background: #f0ece3;
  border: none;
  border-radius: 3px;
  padding: 4px 9px;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: color 0.15s, background 0.15s;
  font-family: 'Noto Sans SC', sans-serif;
}
.sort-btn:hover { color: #6b6358; background: #e8e2d8; }

/* ── Session list ── */
.session-list {
  padding: 16px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Session card ── */
.session-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: #fff;
  border: 0.5px solid #e0ddd6;
  border-radius: 8px;
  padding: 16px 16px 14px;
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  position: relative;
}

.session-card:active { transform: scale(0.98); }

@media (hover: hover) {
  .session-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(42,34,24,0.09);
  }
}

.card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}

.card-chapter {
  font-size: 10px;
  color: #b0a898;
  letter-spacing: 0.1em;
}

.card-date {
  font-size: 10px;
  color: #b0a898;
  letter-spacing: 0.04em;
}

.card-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 700;
  color: #1a1816;
  line-height: 1.5;
  margin-bottom: 12px;
  padding-right: 24px;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag {
  font-size: 10px;
  color: #6b6358;
  background: #f0ece3;
  border-radius: 3px;
  padding: 3px 8px;
  letter-spacing: 0.05em;
}

.card-arrow {
  position: absolute;
  right: 16px;
  bottom: 16px;
  font-size: 14px;
  color: #c9a227;
  line-height: 1;
}

/* ── Empty state ── */
.empty-state {
  padding: 32px 20px;
  text-align: center;
  font-size: 12px;
  color: #b0a898;
  letter-spacing: 0.08em;
  line-height: 2;
}

/* ── Footer ── */
.footer {
  padding: 20px 28px;
  border-top: 0.5px solid #e0ddd6;
  font-size: 10px;
  color: #b0a898;
  text-align: center;
  line-height: 1.8;
}

.footer-logo {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #6b6358;
  margin-bottom: 4px;
}
</style>
</head>
<body>
<div class="page">

  <div class="back-nav">
    <a class="back-link" href="index.html">
      <span class="back-arrow">←</span>书架
    </a>
  </div>

  <!-- 书籍头部 -->
  <div class="header">
    <div class="book-label">共 读 书 目</div>
    <div class="book-title">Atomic Habits</div>
    <div class="book-author">詹姆斯·克利尔</div>
    <div class="book-core">
      You do not rise to the level of your goals. You fall to the level of your systems.
    </div>
    <div class="book-stats">
      <div class="stat">
        <div class="stat-dot"></div>
        共 2 场活动
      </div>
      <div class="stat">
        <div class="stat-dot"></div>
        2026 年 3 月开始
      </div>
    </div>
  </div>

  <!-- 共读记录 -->
  <div class="section-label">
    <span>共 读 记 录</span>
    <button id="sort-btn" class="sort-btn">倒序 ↓</button>
  </div>

  <div class="session-list">

    <!-- 第14-15章 -->
    <a class="session-card" href="atomic-habits-14-15.html">
      <div class="card-top">
        <div class="card-chapter">第 14–15 章</div>
        <div class="card-date">2026-05-24</div>
      </div>
      <div class="card-title">别相信未来的你</div>
      <div class="card-tags">
        <span class="tag">承诺装置</span>
        <span class="tag">摩擦力</span>
        <span class="tag">即时满足</span>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <!-- 第16-17章 -->
    <a class="session-card" href="atomic-habits-16-17.html">
      <div class="card-top">
        <div class="card-chapter">第 16–17 章</div>
        <div class="card-date">2026-06-07</div>
      </div>
      <div class="card-title">进步要可见，代价要可感</div>
      <div class="card-tags">
        <span class="tag">习惯追踪</span>
        <span class="tag">永不间断</span>
        <span class="tag">习惯契约</span>
      </div>
      <div class="card-arrow">→</div>
    </a>

  </div>

  <div class="footer">
    <div class="footer-logo">TL Book Club</div>
    《原子习惯》共读专题
  </div>

</div>
<script>
(function () {
  const list = document.querySelector('.session-list');
  const btn  = document.getElementById('sort-btn');
  let asc = false;

  function chapter(card) {
    const m = card.querySelector('.card-chapter') && card.querySelector('.card-chapter').textContent.match(/\d+/);
    return m ? parseInt(m[0]) : 0;
  }

  function render() {
    const cards = Array.from(list.querySelectorAll('.session-card'));
    if (cards.length === 0) return;
    cards
      .sort((a, b) => asc ? chapter(a) - chapter(b) : chapter(b) - chapter(a))
      .forEach(c => list.appendChild(c));
    btn.textContent = asc ? '正序 ↑' : '倒序 ↓';
  }

  btn.addEventListener('click', function () { asc = !asc; render(); });
  render();
}());
</script>
</body>
</html>
